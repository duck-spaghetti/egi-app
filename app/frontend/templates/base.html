<!DOCTYPE html>
<html lang="{{ lang or 'it' }}" data-text-zoom-enabled>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{% block title %}EGI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/foundations/fonts.css" />

    <link rel="stylesheet" href="/static/css/components/text-zoom.css" />
    <script type="module" src="/static/js/text-zoom.js"></script>

    {% block head %}{% endblock %}
  </head>
  <body>
    {% include 'components/data_status.html' %}

    <link rel="stylesheet" href="/static/css/components/data-status.css" />
    {% block body %}{% endblock %}
  </body>
</html>
