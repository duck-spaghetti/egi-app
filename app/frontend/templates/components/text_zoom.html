<div class="row text-zoom-row" data-text-zoom role="group" aria-labelledby="text-zoom-label">
  <div class="left">
    <span class="icon text-zoom-icon" aria-hidden="true">Aa</span>
    <div class="text">
      <div class="name" id="text-zoom-label" data-i18n="accessibility.title">Accessibilità</div>
      <div class="desc" data-i18n="accessibility.textZoom">Regola lo zoom del testo</div>
    </div>
  </div>
  <div class="text-zoom-actions">
    <button type="button" data-zoom-action="reset" hidden data-i18n="accessibility.reset">Ripristina</button>
    <button type="button" data-zoom-action="decrease" aria-label="Riduci lo zoom del testo" data-i18n-aria-label="accessibility.decrease" disabled>−</button>
    <button type="button" data-zoom-action="increase" aria-label="Aumenta lo zoom del testo" data-i18n-aria-label="accessibility.increase">+</button>
    <output class="text-zoom-status" aria-live="polite" aria-atomic="true"><span data-i18n="accessibility.textZoom">Regola lo zoom del testo</span>: <span data-zoom-value>100%</span></output>
  </div>
</div>
