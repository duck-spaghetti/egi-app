{% extends 'moderation/base.html' %}
{% block body %}
<section class="desk-card narrow">
  <h1>{{ t('moderation.sign_in.title') }}</h1>
  {% if google %}
  <a class="button" href="/moderazione/google">{{ t('moderation.sign_in.google') }}</a>
  <p class="desk-or">{{ t('moderation.sign_in.or') }}</p>
  {% endif %}
  <form method="post" action="/moderazione/accedi" class="desk-form">
    <label>{{ t('moderation.sign_in.login') }}<input name="login" autocomplete="username" required /></label>
    <label>{{ t('moderation.sign_in.password') }}<input name="password" type="password" autocomplete="current-password" required /></label>
    <label>{{ t('moderation.sign_in.code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" /></label>
    <p class="hint">{{ t('moderation.sign_in.code_hint') }}</p>
    <button type="submit">{{ t('moderation.sign_in.submit') }}</button>
  </form>
</section>
{% endblock %}
