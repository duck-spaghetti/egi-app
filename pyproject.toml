[project]
name = "egi-app"
version = "0.1.0"
description = "Local EGI preview of imported, unreviewed Helpinet evidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "jinja2>=3.1.6,<4.0.0",
    "uvicorn>=0.46.0,<0.47.0",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.3",
    "PyYAML==6.0.4",
    "argon2-cffi==25.1.0",
    "pyotp==2.12.1",
    "authlib==1.9.10",
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
dev = []
community = ["egi-reviewer==0.5.0"]
